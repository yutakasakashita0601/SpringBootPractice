<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
<meta charset="UTF-8">
<title>ログイン</title>
</head>
<body>
	<h1>ログイン</h1>
	<p th:if="${param.error}" style="color:red;">メールアドレスまたはパスワードが間違っています</p>
	<form th:action="@{/admin/signin}" method="post">
		<table border="1">
			<tr>
				<td>メールアドレス</td>
				<td>
					<input type ="email" name="username" required>
				</td>
			</tr>
			<tr>
				<td>パスワード</td>
				<td>
					<input type ="password" name="password" required>
				</td>
			</tr>
		</table>
		<input type="submit" value="ログイン">
	</form>
	<p><a href="/admin/signup">新規登録はこちら</a></p>

</body>
</html>
