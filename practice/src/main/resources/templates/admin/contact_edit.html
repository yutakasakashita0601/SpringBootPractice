<!DOCTYPE html>
<html xmlns:th="http://www.tymeleaf.org">
<head>
<meta charset="UTF-8">
<title>お問い合わせ編集</title>
</head>
<body>
	<h1>お問い合わせ編集</h1>
	<form th:action="@{'/admin/contacts/' + ${contact.id} + '/edit'}" method="post">
		<table border="1">
			<tr>
				<th>お問い合わせID</th>
				<td th:text="${contact.id}"></td>
			</tr>
			<tr>
				<th>姓</th>
				<td><input type="text" name="lastName" th:value="${contact.lastName}" required></td>
			</tr>
			<tr>
				<th>名</th>
				<td><input type="text" name="firstName" th:value="${contact.firstName}" required></td>
			</tr>
			<tr>
				<th>メールアドレス</th>
				<td><input type="text" name="email" th:value="${contact.email}" required></td>
			</tr>
			<tr>
				<th>電話番号</th>
				<td><input type="text" name="phone" th:value="${contact.phone}" required></td>
			</tr>
			<tr>
				<th>郵便番号</th>
				<td><input type="text" name="zipCode" th:value="${contact.zipCode}" required></td>
			</tr>
			<tr>
				<th>住所</th>
				<td><input type="text" name="address" th:value="${contact.address}" required></td>
			</tr>
			<tr>
				<th>建物名</th>
				<td><input type="text" name="buildingName" th:value="${contact.buildingName}" required></td>
			</tr>
			<tr>
				<th>お問い合わせ種別</th>
				<td><input type="text" name="contactType" th:value="${contact.contactType}" required></td>
			</tr>
			<tr>
				<th>内容</th>
				<td><input type="text" name="body" th:value="${contact.body}" required></td>
			</tr>
		</table>
		<button type="submit">更新する</button>
	</form>
	<form th:action="@{'/admin/contacts/' + ${contact.id} + '/delete'}" method="post" onsubmit="return confirm('本当に削除しますか？');">
	<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
	<button type="submit" class="btn btn-danger">このお問い合わせを削除</button>
	</form>
	<form th:action="@{/admin/logout}" method="get">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		<button type="submit">ログアウト</button>
	</form>
	<p><a th:href="@{/admin/contacts}">お問い合わせ一覧に戻る</a></p>
</body>
</html>
