<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>お問い合わせ一覧</title>
</head>
<body>
	
	<h1>お問い合わせ一覧</h1>
	<table border="1">
		
	    <tr>
		    <td>お問い合わせID</td>
		    <td>姓</td>
		    <td>名</td>
		    <td>お問い合わせ種別</td>
		    <td>作成日時</td>
		    <td>更新日時</td>
		    <td>お問い合わせの詳細画面</td>
	    </tr>
	    <tr th:each="contact : ${contactList}">
		    <td th:text="${contact.id}"></td>
		    <td th:text="${contact.lastName}"></td>
		    <td th:text="${contact.firstName}"></td>
		    <td th:text="${contact.contactType}"></td>
		    <td th:text="${#dates.format(contact.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
		    <td th:text="${#dates.format(contact.updatedAt, 'yyyy/MM/dd HH:mm')}"></td>
		    <td>
			    <a th:href="@{/admin/contacts/{id}(id=${contact.id})}">詳細</a>
		    </td>
	    </tr>
	</table>
	<form th:action="@{/admin/logout}" method="post" style="margin-top: 20px;">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		<button type="submit">ログアウト</button>
	</form>

</body>
</html>
